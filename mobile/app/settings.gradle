// Gradle root for the app -- its own root under mobile/app, so no Gradle file
// ever lands at the repo root and the sweep's stage() never sees one.
pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement {
  repositoriesMode = RepositoriesMode.FAIL_ON_PROJECT_REPOS
  repositories { google(); mavenCentral() }
}
rootProject.name = 'covenant-node'
include ':app'
// Chaquopy 17.0.0 resolves from Maven Central; no chaquo.com repository entry is needed.
