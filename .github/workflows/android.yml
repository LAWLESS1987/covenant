# android.yml -- build the phone app (mobile/app), prove on an emulator that the
# APK runs the node, and publish it as a GitHub Release. Asked 2026-09-12:
# "create an app for this to run my phone ... use the git hub also for this".
#
# WHAT THIS IS. The node's files are staged from the checkout into $RUNNER_TEMP
# by mobile/app/build.sh, never copied into the tree (test_p18 forbids a second
# copy of the core). The runner image already carries JDK 17 and the Android
# SDK; the build PC carries neither, which is why this runs here. Nothing has a
# key except GITHUB_TOKEN, which creates the release.
#
# WHAT A GREEN RUN MEANS, and no more: an APK that installed on an x86_64
# emulator, started its foreground service, answered /health with the canonical
# genesis, kept answering with the screen off and idle forced, stopped when
# told, and started again. It is NOT proof that the arm64 binaries load on the
# S25+ (a different artefact), that the Start button works (only a finger
# proves the tap path), or that Samsung's sleep policy leaves it alone.
#
# Distinct name and concurrency group so it never cancels covenant.yml's sweep.
# contents: read at the top; contents: write on the release job only -- the
# first write permission any workflow in this repository has held.
name: android

on:
  push:
    branches: ["main"]   # ops/post-commit.autosync pushes sentinel-witness with every commit; that build installed nowhere
    paths:
      - "mobile/app/**"
      - ".github/workflows/android.yml"
      # every name in mobile/app/python_sources.txt (test_m5_app.py M5.11 keeps this list equal to it)
      - "run_node.py"
      - "covenant_unified_v8.py"
      - "covenant_path_pattern.py"
      - "covenant_semantic_judge.py"
      - "covenant_trading_bridge.py"
      - "covenant_neural_bridge.py"
      - "covenant_judge_local.py"
      - "covenant_judge_fallback.py"
      - "covenant_judge_defer.py"
      - "covenant_client.py"
      - "covenant_quiet.py"
      - "genesis.json"
      - "semantic_judge_model.json"
      - "fallback_model.json"
      - "fallback_model_2.json"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "optional permanent release tag, e.g. android-v0.1"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

# No workflow-level env: the first run of this file was rejected by GitHub at
# parse time because it set COVENANT_APP_STAGE from ${{ runner.temp }} here,
# and the runner context does not exist at workflow level. build.sh already
# stages to $RUNNER_TEMP/covenant-app when the variable is unset.

jobs:
  build:
    name: build the APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # build.sh derives versionCode from `git rev-list --count HEAD`

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # Chaquopy's buildPython must match the app's 3.12

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/chaquopy
          key: chaquopy-17.0.0-${{ hashFiles('mobile/app/app/requirements-android.txt') }}

      - name: Declare what this run is
        run: |
          echo "commit $GITHUB_SHA"
          python --version; java -version; gradle --version | head -5
          ls "$ANDROID_HOME/platforms" || true
          sha256sum covenant_unified_v8.py

      - name: Build
        run: sh mobile/app/build.sh

      - name: The build wrote nothing into the checkout
        run: |
          test -z "$(git status --porcelain)" || { git status --porcelain; echo "build wrote into the checkout"; exit 1; }

      - name: The APK carries the core, and the core is the checkout's
        run: |
          APK="$RUNNER_TEMP/covenant-app/covenant-node.apk"
          unzip -l "$APK" | grep -E 'assets/core/(covenant_unified_v8.py|genesis.json|semantic_judge_model.json|fallback_model.json)|lib/(arm64-v8a|x86_64)/libpython3.12.so'
          unzip -o -q "$APK" 'assets/core/covenant_unified_v8.py' -d "$RUNNER_TEMP/x"
          cmp "$RUNNER_TEMP/x/assets/core/covenant_unified_v8.py" covenant_unified_v8.py && echo "core in APK == core in checkout"
          "$ANDROID_HOME"/build-tools/35.0.0/aapt2 dump badging "$APK" | grep -E "targetSdkVersion:'35'|FOREGROUND_SERVICE_SPECIAL_USE"

      - uses: actions/upload-artifact@v4
        with:
          name: covenant-node-apk
          path: ${{ runner.temp }}/covenant-app/covenant-node.apk
          retention-days: 30

  verify:
    name: run it on an emulator
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: covenant-node-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # No AVD cache: the first run reached the script 108 s into this step
      # without one, and saving a multi-GB snapshot after every run costs
      # more than it saves. The script writes logcat.txt and app_files.txt
      # itself, on every exit: the action kills the emulator at the end of
      # THIS step, and a later step's `adb logcat` waits for a device forever
      # (the first run spent its remaining 40 minutes doing exactly that).
      - name: Boot the APK and read its /health
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: sh mobile/app/ci_check.sh apk/covenant-node.apk

      - name: Keep the evidence
        if: always()
        run: |
          { echo '### phone /health on the emulator'; echo '```'; cat health.json 2>/dev/null | head -c 2000; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
          { echo '### the app files (last_exit.txt, node.log tail)'; echo '```'; cat app_files.txt 2>/dev/null | tail -c 3000; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-verify-logs
          path: |
            health.json
            health2.json
            health3.json
            logcat.txt
            app_files.txt
          retention-days: 14
          if-no-files-found: ignore

  # PRIVATE FOR NOW (the operator, 2026-09-12). The release job that published
  # every verified build as a public GitHub release is gone, and the eight
  # releases it made were taken down. The APK is the run's artifact
  # (covenant-node-apk, 14 days, a GitHub login required to fetch it), or a
  # cable build: sh mobile/app/build.sh. The source stays in this repository.
